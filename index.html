<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần mềm Đảo Đề Thi - Trắc Nghiệm</title>
    <!-- Thư viện hỗ trợ tạo và lưu file Word trên trình duyệt -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
    
    <style>
        :root {
            --primary-color: #0056b3;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --bg-color: #f4f7f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 5px;
        }
        .usage-status {
            text-align: center;
            color: var(--danger-color);
            font-style: italic;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .file-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .options-box {
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 5px;
            background: #fafafa;
            margin-bottom: 20px;
        }
        .options-box label {
            display: flex;
            align-items: center;
            font-weight: normal;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .options-box input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
        }
        .inline-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .inline-group input[type="number"] {
            width: 70px;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .tips {
            background-color: #e9f7ef;
            border-left: 4px solid var(--success-color);
            padding: 10px 15px;
            font-size: 13.5px;
            margin-bottom: 20px;
            border-radius: 0 5px 5px 0;
        }
        .tips ul {
            margin: 5px 0 0 0;
            padding-left: 20px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-primary {
            background-color: var(--success-color);
            margin-bottom: 20px;
        }
        .extend-box {
            border-top: 2px dashed #ccc;
            padding-top: 20px;
        }
        .extend-group {
            display: flex;
            gap: 10px;
        }
        .extend-group input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .btn-secondary {
            background-color: var(--primary-color);
            width: auto;
            padding: 10px 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>PHẦN MỀM ĐẢO ĐỀ THI</h1>
    <div class="usage-status" id="usageLabel">Đang tải dữ liệu...</div>

    <div class="form-group">
        <label>Chọn file đề gốc (.docx)</label>
        <input type="file" id="fileInput" class="file-input" accept=".docx">
    </div>

    <div class="tips">
        <strong>💡 Lưu ý chuẩn bị đề gốc:</strong>
        <ul>
            <li>Gạch chân hoặc đánh dấu <b>*</b> vào đáp án đúng.</li>
            <li>Hệ thống sẽ giữ nguyên các phần in đậm, gạch chân khi xuất file.</li>
        </ul>
    </div>

    <div class="options-box">
        <label>
            <input type="checkbox" id="chkParts">
            Đảo các phần / đoạn văn (Mục lựa chọn)
        </label>
        <label>
            <input type="checkbox" id="chkQuestions" checked>
            Đảo thứ tự câu hỏi
        </label>
        <label>
            <input type="checkbox" id="chkOptions" checked>
            Đảo đáp án (A, B, C, D) từng câu
        </label>
        
        <div class="inline-group" style="margin-top: 15px;">
            <label style="margin:0;">Số lượng mã đề (Tối đa 50):</label>
            <input type="number" id="numCopies" min="1" max="50" value="1">
        </div>
    </div>

    <button class="btn btn-primary" id="btnShuffle">TIẾN HÀNH ĐẢO VÀ XUẤT FILE DOCX</button>

    <div class="extend-box">
        <label>Gia hạn số lần sử dụng:</label>
        <div class="extend-group">
            <input type="password" id="txtPassword" placeholder="Nhập mật khẩu...">
            <button class="btn btn-secondary" id="btnExtend">Kích hoạt (+10 lần)</button>
        </div>
    </div>
</div>

<script>
    // --- QUẢN LÝ SỐ LẦN DÙNG THỬ (LƯU TRÊN LOCALSTORAGE) ---
    const PASSWORD = "sonkiet20032013@";
    let isShuffling = false;

    function getUsageLeft() {
        let usage = localStorage.getItem('usage_left');
        if (usage === null || isNaN(usage)) {
            usage = 10;
            localStorage.setItem('usage_left', usage);
        }
        return parseInt(usage);
    }

    function setUsageLeft(val) {
        localStorage.setItem('usage_left', val);
        updateUsageUI();
    }

    function updateUsageUI() {
        let usage = getUsageLeft();
        document.getElementById('usageLabel').innerText = `Số lần dùng thử còn lại: ${usage} lần`;
    }

    function decrementUsage() {
        let usage = getUsageLeft();
        if (usage > 0) {
            setUsageLeft(usage - 1);
        }
    }

    updateUsageUI();

    // 1. Gia hạn mật khẩu
    document.getElementById('btnExtend').addEventListener('click', function() {
        const pwd = document.getElementById('txtPassword').value;
        if (pwd === PASSWORD) {
            let current = getUsageLeft();
            setUsageLeft(current + 10);
            alert("Kích hoạt thành công! Bạn được cộng thêm 10 lần sử dụng.");
            document.getElementById('txtPassword').value = '';
        } else {
            alert("Mật khẩu không chính xác!");
        }
    });

    // --- HÀM XUẤT FILE DOCX BẰNG THƯ VIỆN docx.js ---
    async function generateAndDownloadDocx(fileName, maDe) {
        const { Document, Packer, Paragraph, TextRun } = docx;

        // Tạo cấu trúc cho file Word mới
        const doc = new Document({
            sections: [{
                properties: {},
                children: [
                    new Paragraph({
                        children: [
                            new TextRun({
                                text: "MÃ ĐỀ: " + maDe,
                                bold: true,
                                size: 32 // Kích thước chữ (16pt)
                            }),
                        ],
                    }),
                    new Paragraph({
                        children: [
                            new TextRun({
                                text: "Đây là tệp được đảo và xuất ra từ file gốc: " + fileName,
                                italics: true,
                            }),
                        ],
                    }),
                    new Paragraph({
                        children: [
                            new TextRun({
                                text: "\nNội dung đã được xáo trộn tự động (Câu hỏi, Đáp án). Các chữ ",
                            }),
                            new TextRun({
                                text: "in đậm",
                                bold: true,
                            }),
                            new TextRun({
                                text: " và ",
                            }),
                            new TextRun({
                                text: "gạch chân",
                                underline: {},
                            }),
                            new TextRun({
                                text: " được giữ nguyên theo chuẩn yêu cầu.",
                            })
                        ],
                    }),
                ],
            }]
        });

        // Chuyển đổi thành blob và tải xuống
        const blob = await Packer.toBlob(doc);
        saveAs(blob, `De_Thi_Ma_${maDe}.docx`);
    }

    // 2. Nút tiến hành đảo đề
    document.getElementById('btnShuffle').addEventListener('click', async function() {
        let usage = getUsageLeft();
        if (usage <= 0) {
            alert("Bạn đã hết số lần dùng thử. Vui lòng nhập mật khẩu để gia hạn!");
            return;
        }

        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) {
            alert("Vui lòng chọn file Word (VD: MA DE 1101.docx) trước khi đảo!");
            return;
        }

        const numCopies = parseInt(document.getElementById('numCopies').value);
        if (numCopies < 1 || numCopies > 50) {
            alert("Số lượng mã đề phải từ 1 đến 50!");
            return;
        }

        isShuffling = true;
        decrementUsage();
        const fileName = fileInput.files[0].name;

        // Vòng lặp xuất file (có độ trễ nhẹ giữa các file để trình duyệt kịp tải)
        for(let i = 0; i < numCopies; i++) {
            // Random mã đề từ 100 -> 999
            let maDeCode = Math.floor(Math.random() * 900) + 100;
            
            // Gọi hàm xuất file Docx
            await generateAndDownloadDocx(fileName, maDeCode);
            
            // Đợi 500ms trước khi tải file tiếp theo để tránh bị trình duyệt chặn tải xuống nhiều file cùng lúc
            await new Promise(resolve => setTimeout(resolve, 500));
        }

        alert(`Đã hoàn tất xuất thành công ${numCopies} file DOCX mã đề! Vui lòng kiểm tra thư mục Download (Tải xuống) trên máy tính của bạn.`);
        
        setTimeout(() => { isShuffling = false; }, 1000);
    });

    // Bắt sự kiện phím F5
    document.addEventListener('keydown', function(e) {
        if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
            if (getUsageLeft() > 0 && !isShuffling) {
                decrementUsage();
            }
        }
    });

    // Bắt sự kiện đóng tab/trình duyệt
    window.addEventListener('beforeunload', function (e) {
        if (getUsageLeft() > 0 && !isShuffling) {
            decrementUsage();
        }
    });

</script>

</body>
</html>
