<!-- NÚNG CODE PYTHON GỐC VÀO ĐÂY (engine.py) -->
<script type="text/python" id="engineCode">
import re
import copy
import random
from docx import Document
from docx.oxml.ns import qn
from docx.text.run import Run as _DocxRun

QUESTION_RE = re.compile(r'Question\s+(\d+)\s*\.', re.IGNORECASE)
FROM_TO_RE = re.compile(r'from\s+(\d+)\s+to\s+(\d+)', re.IGNORECASE)
OPTION_START_RE = re.compile(r'^\s*([ABCD])\.\s')
INLINE_OPTIONS_RE = re.compile(
    r'(?P<A>A\.\s.*?)(?=\t?\s*B\.\s)\t?\s*'
    r'(?P<B>B\.\s.*?)(?=\t?\s*C\.\s)\t?\s*'
    r'(?P<C>C\.\s.*?)(?=\t?\s*D\.\s)\t?\s*'
    r'(?P<D>D\.\s.*)$',
    re.DOTALL
)

CIRCLED = {"A": "\u24B6", "B": "\u24B7", "C": "\u24B8", "D": "\u24B9"}  # Ⓐ Ⓑ Ⓒ Ⓓ

def flatten_runs(paragraph):
    spans = []
    pos = [0]
    def walk(el):
        for child in el:
            tag = child.tag
            if tag == qn('w:r'):
                run = _DocxRun(child, paragraph)
                t = run.text
                if t:
                    spans.append((pos[0], pos[0] + len(t), run))
                    pos[0] += len(t)
            elif tag == qn('w:pPr'):
                continue
            else:
                walk(child)
    walk(paragraph._p)
    return spans

def para_text(paragraph):
    return "".join(r.text for _s, _e, r in flatten_runs(paragraph))

def slice_text_runs(spans, start, end):
    out = []
    for s, e, r in spans:
        if e <= start or s >= end:
            continue
        seg_start = max(s, start)
        seg_end = min(e, end)
        text = r.text[seg_start - s: seg_end - s]
        if text:
            out.append((text, r))
    return out

def run_has_underline(run):
    rpr = run._r.find(qn('w:rPr'))
    if rpr is None:
        return False
    u = rpr.find(qn('w:u'))
    if u is None:
        return False
    val = u.get(qn('w:val'))
    return val not in (None, 'none', '0', 'false')

def copy_rpr(new_run, source_run, strip_underline=False):
    src_rpr = source_run._r.find(qn('w:rPr'))
    if src_rpr is not None:
        new_rpr = copy.deepcopy(src_rpr)
        if strip_underline:
            for u in list(new_rpr.findall(qn('w:u'))):
                new_rpr.remove(u)
        old = new_run._r.find(qn('w:rPr'))
        if old is not None:
            new_run._r.remove(old)
        new_run._r.insert(0, new_rpr)

def copy_ppr(new_paragraph, source_paragraph):
    src_ppr = source_paragraph._p.find(qn('w:pPr'))
    if src_ppr is not None:
        new_ppr = copy.deepcopy(src_ppr)
        old = new_paragraph._p.find(qn('w:pPr'))
        if old is not None:
            new_paragraph._p.remove(old)
        new_paragraph._p.insert(0, new_ppr)

class ParaSpec:
    __slots__ = ("source_paragraph", "segments")
    def __init__(self, source_paragraph, segments):
        self.source_paragraph = source_paragraph
        self.segments = segments

class Option:
    __slots__ = ("letter_orig", "segments", "is_correct")
    def __init__(self, letter_orig, segments, is_correct):
        self.letter_orig = letter_orig
        self.segments = segments
        self.is_correct = is_correct

    def plain_text(self):
        t = "".join(s[0] for s in self.segments)
        return re.sub(r'^\s*[ABCD]\.\s*', '', t).strip()

class QuestionBlock:
    __slots__ = ("number", "stem_paragraphs", "options", "options_mode", "options_ppr_source")
    def __init__(self, number):
        self.number = number
        self.stem_paragraphs = []
        self.options = []
        self.options_mode = None
        self.options_ppr_source = None

def _seg_slice(spans, a, b, number_span=None):
    segments = []
    if number_span and a <= number_span[0] and number_span[1] <= b:
        ns, ne = number_span
        if a < ns:
            for t, r in slice_text_runs(spans, a, ns):
                segments.append((t, r, False, False))
        for t, r in slice_text_runs(spans, ns, ne):
            segments.append((t, r, False, True))
        if ne < b:
            for t, r in slice_text_runs(spans, ne, b):
                segments.append((t, r, False, False))
    else:
        for t, r in slice_text_runs(spans, a, b):
            segments.append((t, r, False, False))
    return segments

def _make_para_spec(paragraph, a=0, b=None, number_span=None):
    text = para_text(paragraph)
    if b is None:
        b = len(text)
    spans = flatten_runs(paragraph)
    segments = _seg_slice(spans, a, b, number_span)
    return ParaSpec(paragraph, segments)

def _mark_option_correctness(segments):
    if not segments:
        return segments, False
    first_text, first_run, _su, _isn = segments[0]
    is_correct = run_has_underline(first_run)
    if is_correct:
        segments = list(segments)
        t, r, _su, isn = segments[0]
        segments[0] = (t, r, True, isn)
    return segments, is_correct

def _extract_inline_options(paragraph, options_text_start):
    text = para_text(paragraph)
    spans = flatten_runs(paragraph)
    sub = text[options_text_start:]
    m = INLINE_OPTIONS_RE.search(sub)
    if not m:
        return None, None
    options = []
    for letter in "ABCD":
        abs_start = options_text_start + m.start(letter)
        abs_end = options_text_start + m.end(letter)
        segs = _seg_slice(spans, abs_start, abs_end)
        segs, is_correct = _mark_option_correctness(segs)
        options.append(Option(letter, segs, is_correct))
    stem_end_abs = options_text_start + m.start('A')
    return options, stem_end_abs

def _extract_separate_options(paragraphs4):
    options = []
    for letter, p in zip("ABCD", paragraphs4):
        text = para_text(p)
        spans = flatten_runs(p)
        segs = _seg_slice(spans, 0, len(text))
        segs, is_correct = _mark_option_correctness(segs)
        options.append(Option(letter, segs, is_correct))
    return options

def parse_exam(docx_path):
    doc = Document(docx_path)
    paragraphs = doc.paragraphs
    n = len(paragraphs)

    marker_at = {}
    marker_span_at = {}
    for i, p in enumerate(paragraphs):
        m = QUESTION_RE.search(para_text(p))
        if m:
            marker_at[i] = int(m.group(1))
            marker_span_at[i] = m.span(1)

    marker_indices = sorted(marker_at.keys())
    prelude = []
    questions = []
    fillers_after = {}

    first_marker_idx = marker_indices[0] if marker_indices else n
    for i in range(0, first_marker_idx):
        prelude.append(_make_para_spec(paragraphs[i]))

    for mi_pos, idx in enumerate(marker_indices):
        qnum = marker_at[idx]
        num_span = marker_span_at[idx]
        qb = QuestionBlock(qnum)
        marker_para = paragraphs[idx]
        marker_para_text = para_text(marker_para)
        marker_m = QUESTION_RE.search(marker_para_text)
        after_marker = marker_m.end()
        next_marker_idx = marker_indices[mi_pos + 1] if mi_pos + 1 < len(marker_indices) else n

        opts, stem_end_abs = _extract_inline_options(marker_para, after_marker)
        cursor = idx + 1
        if opts is not None:
            qb.stem_paragraphs.append(_make_para_spec(marker_para, 0, stem_end_abs, num_span))
            qb.options = opts
            qb.options_mode = 'inline_with_marker'
            qb.options_ppr_source = marker_para
        else:
            qb.stem_paragraphs.append(_make_para_spec(marker_para, 0, len(marker_para_text), num_span))
            found_options = False
            while cursor < next_marker_idx:
                p = paragraphs[cursor]
                text = para_text(p)
                if OPTION_START_RE.match(text):
                    m_inline = INLINE_OPTIONS_RE.search(text)
                    if m_inline and m_inline.start('A') == 0:
                        opts, _ = _extract_inline_options(p, 0)
                        qb.options = opts
                        qb.options_mode = 'same_line'
                        qb.options_ppr_source = p
                        cursor += 1
                        found_options = True
                        break
                    m0 = OPTION_START_RE.match(text)
                    if m0.group(1) == 'A' and cursor + 3 < next_marker_idx:
                        p2, p3, p4 = paragraphs[cursor + 1], paragraphs[cursor + 2], paragraphs[cursor + 3]
                        m1, m2, m3 = (OPTION_START_RE.match(para_text(p2)),
                                      OPTION_START_RE.match(para_text(p3)),
                                      OPTION_START_RE.match(para_text(p4)))
                        if m1 and m1.group(1) == 'B' and m2 and m2.group(1) == 'C' and m3 and m3.group(1) == 'D':
                            opts = _extract_separate_options([p, p2, p3, p4])
                            qb.options = opts
                            qb.options_mode = 'separate'
                            qb.options_ppr_source = p
                            cursor += 4
                            found_options = True
                            break
                qb.stem_paragraphs.append(_make_para_spec(p))
                cursor += 1
            if not found_options:
                qb.options = []
                qb.options_mode = None

        questions.append(qb)
        fillers_after[qnum] = []
        for i in range(cursor, next_marker_idx):
            fillers_after[qnum].append(_make_para_spec(paragraphs[i]))

    return {"doc_path": docx_path, "prelude": prelude, "questions": questions, "fillers_after": fillers_after}

def detect_parts(parsed):
    parts = []
    texts = []

    def spec_text(spec):
        return "".join(seg[0] for seg in spec.segments)

    for spec in parsed["prelude"]:
        texts.append(spec_text(spec))
    for qnum, specs in parsed["fillers_after"].items():
        for spec in specs:
            texts.append(spec_text(spec))

    for text in texts:
        m = FROM_TO_RE.search(text)
        if m:
            qf, qt = int(m.group(1)), int(m.group(2))
            label = text.strip()
            if len(label) > 90:
                label = label[:87] + "..."
            parts.append({"label": label, "q_from": qf, "q_to": qt, "is_cloze": False})

    qmap = {q.number: q for q in parsed["questions"]}
    for part in parts:
        empties, total = 0, 0
        for qn in range(part["q_from"], part["q_to"] + 1):
            q = qmap.get(qn)
            if q is None:
                continue
            total += 1
            raw = "".join(seg[0] for sp in q.stem_paragraphs for seg in sp.segments)
            stripped = QUESTION_RE.sub('', raw, count=1).strip()
            if stripped == "":
                empties += 1
        if total and empties / total >= 0.5:
            part["is_cloze"] = True

    parts.sort(key=lambda x: x["q_from"])
    return parts

def shuffle_plan(parsed, parts, opts, rng=None):
    if rng is None:
        rng = random
    qmap = {q.number: q for q in parsed["questions"]}
    all_numbers = sorted(qmap.keys())
    new_order = list(all_numbers)
    option_perm = {}

    for pi, part in enumerate(parts):
        cfg = opts.get(pi, {})
        qnums_in_part = [n for n in range(part["q_from"], part["q_to"] + 1) if n in qmap]

        if cfg.get("shuffle_order") and not part["is_cloze"] and len(qnums_in_part) > 1:
            positions = [all_numbers.index(n) for n in qnums_in_part]
            shuffled_content = qnums_in_part[:]
            rng.shuffle(shuffled_content)
            for pos, content_qn in zip(positions, shuffled_content):
                new_order[pos] = content_qn

        if cfg.get("shuffle_options"):
            for qn in qnums_in_part:
                q = qmap[qn]
                if len(q.options) == 4:
                    order = [0, 1, 2, 3]
                    rng.shuffle(order)
                    option_perm[qn] = [q.options[i] for i in order]

    for qn, q in qmap.items():
        option_perm.setdefault(qn, list(q.options))

    return new_order, option_perm

def _copy_seg_run(paragraph, seg, new_number_str=None):
    text, run, strip_u, is_number = seg
    out_text = new_number_str if (is_number and new_number_str is not None) else text
    r = paragraph.add_run(out_text)
    copy_rpr(r, run, strip_underline=strip_u)
    return r

def _emit_plain_paragraph(doc, spec):
    p = doc.add_paragraph()
    copy_ppr(p, spec.source_paragraph)
    for seg in spec.segments:
        _copy_seg_run(p, seg)
    return p

_LEADING_LETTER_RE = re.compile(r'^(\s*)([ABCD])(\.)')

def _relabel_first_char(seg, new_letter):
    text, run, strip_u, is_number = seg
    m = _LEADING_LETTER_RE.match(text)
    if m:
        text = text[:m.start(2)] + new_letter + text[m.end(2):]
    return (text, run, strip_u, is_number)

def _emit_option_run(paragraph, opt, new_letter, is_first_of_opt):
    for j, seg in enumerate(opt.segments):
        if j == 0 and is_first_of_opt:
            seg = _relabel_first_char(seg, new_letter)
        _copy_seg_run(paragraph, seg)

def render_exam_docx(parsed, new_order, option_perm, number_str_map, out_path, header_line=None):
    doc = Document(parsed["doc_path"])
    body = doc.element.body
    sect_prs = body.findall(qn('w:sectPr'))
    for child in list(body):
        if child.tag != qn('w:sectPr'):
            body.remove(child)

    if header_line:
        p = doc.add_paragraph()
        r = p.add_run(header_line)
        r.bold = True

    qmap = {q.number: q for q in parsed["questions"]}

    for spec in parsed["prelude"]:
        _emit_plain_paragraph(doc, spec)

    for old_qn in new_order:
        q = qmap[old_qn]
        new_num_str = number_str_map[old_qn]
        opts = option_perm[old_qn]

        if q.options_mode == 'inline_with_marker':
            p = doc.add_paragraph()
            copy_ppr(p, q.stem_paragraphs[0].source_paragraph)
            for seg in q.stem_paragraphs[0].segments:
                _copy_seg_run(p, seg, new_num_str)
            for i, opt in enumerate(opts):
                if i > 0:
                    tab_run = p.add_run("\t")
                    copy_rpr(tab_run, opt.segments[0][1])
                _emit_option_run(p, opt, "ABCD"[i], True)
        else:
            for sp in q.stem_paragraphs:
                p = doc.add_paragraph()
                copy_ppr(p, sp.source_paragraph)
                for seg in sp.segments:
                    _copy_seg_run(p, seg, new_num_str)

            if q.options_mode == 'same_line':
                p = doc.add_paragraph()
                copy_ppr(p, q.options_ppr_source)
                for i, opt in enumerate(opts):
                    if i > 0:
                        tab_run = p.add_run("\t")
                        copy_rpr(tab_run, opt.segments[0][1])
                    _emit_option_run(p, opt, "ABCD"[i], True)
            elif q.options_mode == 'separate':
                for i, opt in enumerate(opts):
                    p = doc.add_paragraph()
                    copy_ppr(p, q.options_ppr_source)
                    _emit_option_run(p, opt, "ABCD"[i], True)

        for spec in parsed["fillers_after"].get(old_qn, []):
            _emit_plain_paragraph(doc, spec)

    if sect_prs:
        body.append(copy.deepcopy(sect_prs[-1]))
    doc.save(out_path)

def compute_answer_key(new_order, option_perm, number_str_map):
    result = []
    for old_qn in new_order:
        opts = option_perm[old_qn]
        correct_letter = None
        for i, opt in enumerate(opts):
            if opt.is_correct:
                correct_letter = "ABCD"[i]
                break
        result.append((number_str_map[old_qn], correct_letter))
    return result

def build_answer_key_docx(all_keys, out_path):
    doc = Document()
    doc.add_heading("BẢNG ĐÁP ÁN", level=1)
    for ma_de_label, keys in all_keys:
        doc.add_heading(ma_de_label, level=2)
        table = doc.add_table(rows=0, cols=10)
        table.style = "Table Grid"
        for i in range(0, len(keys), 10):
            row_cells = table.add_row().cells
            for j, (num_str, letter) in enumerate(keys[i:i + 10]):
                shown = CIRCLED.get(letter, "?") if letter else "?"
                row_cells[j].text = f"{num_str}. {shown}"
    doc.save(out_path)

GLOBAL_PARSED = None
</script>

<script>
    const logArea = document.getElementById('logArea');
    const loadBtn = document.getElementById('loadBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    let pyodide;
    
    // Config limit
    const UNLOCK_PWD = "sonkiet20032013@";
    const FREE_LIMIT = 10;
    
    function log(msg) {
        logArea.value += msg + "\n";
        logArea.scrollTop = logArea.scrollHeight;
        console.log(msg);
    }

    function initTrial() {
        if (!localStorage.getItem('dao_de_limit')) localStorage.setItem('dao_de_limit', FREE_LIMIT);
        if (!localStorage.getItem('dao_de_used')) localStorage.setItem('dao_de_used', 0);
        updateTrialUI();
    }

    function updateTrialUI() {
        let limit = parseInt(localStorage.getItem('dao_de_limit'));
        let used = parseInt(localStorage.getItem('dao_de_used'));
        let rem = Math.max(0, limit - used);
        document.getElementById('trialStatus').innerText = `Số lượt dùng thử còn lại: ${rem}`;
    }

    function consumeTrial() {
        let used = parseInt(localStorage.getItem('dao_de_used'));
        localStorage.setItem('dao_de_used', used + 1);
        updateTrialUI();
    }

    function checkTrial() {
        let limit = parseInt(localStorage.getItem('dao_de_limit'));
        let used = parseInt(localStorage.getItem('dao_de_used'));
        if (limit - used <= 0) {
            let pwd = prompt(`Bạn đã dùng hết ${limit} lượt dùng thử.\nNhập mật khẩu để được cộng thêm 10 lượt:`);
            if (pwd === UNLOCK_PWD) {
                localStorage.setItem('dao_de_limit', limit + 10);
                updateTrialUI();
                alert("Đã mở khóa thành công!");
                return true;
            } else if (pwd !== null) {
                alert("Sai mật khẩu.");
                return false;
            }
            return false;
        }
        return true;
    }

    async function initPyodideEnv() {
        try {
            loadBtn.disabled = true;
            shuffleBtn.disabled = true;
            log("⏳ Đang tải môi trường Python (Pyodide)... Có thể mất vài chục giây trong lần tải đầu tiên.");
            
            pyodide = await loadPyodide();
            log("✅ Đã tải Pyodide. Đang cài đặt thư viện 'python-docx' (micropip)...");
            
            await pyodide.loadPackage("micropip");
            const micropip = pyodide.pyimport("micropip");
            await micropip.install('python-docx');
            
            log("✅ Đã cài đặt xong python-docx. Đang nạp engine xử lý...");
            const pyCode = document.getElementById('engineCode').textContent;
            await pyodide.runPythonAsync(pyCode);
            
            log("🚀 HỆ THỐNG SẴN SÀNG! Vui lòng chọn file đề gốc (.docx) để bắt đầu.");
            loadBtn.disabled = false;
        } catch(err) {
            log("❌ Lỗi khởi tạo hệ thống: " + err);
        }
    }

    // --- EVENTS ---
    loadBtn.onclick = async () => {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];
        if (!file) {
            alert("Vui lòng chọn file đề gốc (.docx) trước!");
            return;
        }
        
        loadBtn.disabled = true;
        log(`\n⏳ Đang đọc file: ${file.name}...`);
        try {
            const buf = await file.arrayBuffer();
            pyodide.FS.writeFile("input.docx", new Uint8Array(buf));
            
            log("⏳ Đang phân tích câu hỏi và các phần trong đề...");
            const resJson = pyodide.runPython(`
import json
import traceback

try:
    GLOBAL_PARSED = parse_exam("input.docx")
    parts = detect_parts(GLOBAL_PARSED)
    
    if not parts:
        parts = [{"label": "Toàn bộ đề (không tách được phần)", "q_from": 1,
                  "q_to": max((q.number for q in GLOBAL_PARSED["questions"]), default=0),
                  "is_cloze": False}]
                  
    res = json.dumps({"success": True, "parts": parts})
except Exception as e:
    res = json.dumps({"success": False, "error": str(e), "trace": traceback.format_exc()})
res
            `);
            
            const result = JSON.parse(resJson);
            if (!result.success) {
                log("❌ LỖI PHÂN TÍCH:\n" + result.error + "\n" + result.trace);
                return;
            }
            
            window.examParts = result.parts;
            renderParts(result.parts);
            log(`✅ Phân tích xong! Nhận diện được ${result.parts.length} phần.`);
            shuffleBtn.disabled = false;
        } catch (err) {
            log("❌ Lỗi hệ thống khi nạp: " + err);
        } finally {
            loadBtn.disabled = false;
        }
    };

    function renderParts(parts) {
        const container = document.getElementById('partsContainer');
        if (parts.length === 0) {
            container.innerHTML = "Không tìm thấy phần nào.";
            return;
        }
        let html = `
            <table class="w-full text-left border-collapse bg-white">
                <thead class="bg-gray-100 sticky top-0 shadow-sm">
                    <tr>
                        <th class="p-2 border-b">Phần</th>
                        <th class="p-2 border-b">Mô tả</th>
                        <th class="p-2 border-b text-center">Xáo đáp án</th>
                        <th class="p-2 border-b text-center">Xáo thứ tự câu</th>
                    </tr>
                </thead>
                <tbody>
        `;
        parts.forEach((p, i) => {
            html += `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-2 font-medium">Câu ${p.q_from}-${p.q_to}</td>
                    <td class="p-2 text-xs truncate max-w-xs" title="${p.label}">${p.label}</td>
                    <td class="p-2 text-center">
                        <input type="checkbox" id="opt_${i}" checked class="w-4 h-4 text-blue-600" />
                    </td>
                    <td class="p-2 text-center">
                        <div class="flex items-center justify-center space-x-1">
                            <input type="checkbox" id="ord_${i}" ${p.is_cloze ? 'disabled' : 'checked'} class="w-4 h-4 text-blue-600" />
                            ${p.is_cloze ? '<span class="text-[10px] text-gray-400 italic">(điền khuyết)</span>' : ''}
                        </div>
                    </td>
                </tr>
            `;
        });
        html += `</tbody></table>`;
        container.innerHTML = html;
        container.classList.remove('text-center', 'text-gray-500');
    }

    shuffleBtn.onclick = async () => {
        if (!window.examParts) return;
        if (!checkTrial()) return;

        shuffleBtn.disabled = true;
        const numExams = parseInt(document.getElementById('numExams').value) || 4;
        const startCode = parseInt(document.getElementById('startCode').value) || 101;
        const insertHeader = document.getElementById('insertHeader').checked;

        // Thu thập cài đặt các phần
        const opts = {};
        window.examParts.forEach((p, i) => {
            opts[i] = {
                shuffle_options: document.getElementById(`opt_${i}`).checked,
                shuffle_order: document.getElementById(`ord_${i}`).checked
            };
        });

        log(`\n⏳ Bắt đầu tạo ${numExams} mã đề (từ mã ${startCode})...`);

        // Gửi tham số vào Pyodide
        pyodide.globals.set("gui_opts", JSON.stringify(opts));
        pyodide.globals.set("gui_numExams", numExams);
        pyodide.globals.set("gui_startCode", startCode);
        pyodide.globals.set("gui_insertHeader", insertHeader);

        try {
            const outJson = pyodide.runPython(`
import json
import base64
import os
import random
import traceback

try:
    opts_dict = json.loads(gui_opts)
    opts_dict = {int(k): v for k, v in opts_dict.items()}

    num_exams = int(gui_numExams)
    start_code = int(gui_startCode)
    insert_header = bool(gui_insertHeader)

    out_files = {}
    all_keys = []
    
    if GLOBAL_PARSED is None:
        raise ValueError("Chưa nạp đề gốc! GLOBAL_PARSED is None.")

    parts = detect_parts(GLOBAL_PARSED)
    if not parts:
        parts = [{"label": "Toàn bộ đề (không tách được phần)", "q_from": 1,
                  "q_to": max((q.number for q in GLOBAL_PARSED["questions"]), default=0),
                  "is_cloze": False}]

    for i in range(num_exams):
        ma_de = str(start_code + i)
        new_order, option_perm = shuffle_plan(GLOBAL_PARSED, parts, opts_dict, rng=random)
        number_str_map = {old_qn: str(pos + 1) for pos, old_qn in enumerate(new_order)}
        header_line = f"Mã đề: {ma_de}" if insert_header else None
        
        out_path = f"MaDe_{ma_de}.docx"
        render_exam_docx(GLOBAL_PARSED, new_order, option_perm, number_str_map, out_path, header_line=header_line)
        
        keys = compute_answer_key(new_order, option_perm, number_str_map)
        all_keys.append((f"Mã đề {ma_de}", keys))
        
        with open(out_path, "rb") as f:
            out_files[out_path] = base64.b64encode(f.read()).decode('utf-8')

    key_path = "BangDapAn.docx"
    build_answer_key_docx(all_keys, key_path)
    with open(key_path, "rb") as f:
        out_files[key_path] = base64.b64encode(f.read()).decode('utf-8')

    res_final = json.dumps({"success": True, "files": out_files})
except Exception as e:
    res_final = json.dumps({"success": False, "error": str(e), "trace": traceback.format_exc()})
res_final
            `);

            const result = JSON.parse(outJson);
            if (!result.success) {
                log("❌ LỖI KHI ĐẢO ĐỀ:\n" + result.error + "\n" + result.trace);
                return;
            }

            log("✅ Tạo file hoàn tất! Đang nén thành thư mục ZIP...");
            const zip = new JSZip();
            for (const [filename, b64str] of Object.entries(result.files)) {
                zip.file(filename, b64str, {base64: true});
            }

            const zipBlob = await zip.generateAsync({type: "blob"});
            saveAs(zipBlob, `KetQua_DaoDe_${startCode}.zip`);
            
            log("🎉 Đã tải xuống file ZIP thành công!");
            consumeTrial();

        } catch (err) {
            log("❌ Lỗi hệ thống trong quá trình đảo: " + err);
        } finally {
            shuffleBtn.disabled = false;
        }
    };

    // Khởi động
    initTrial();
    initPyodideEnv();
</script>

</body>
</html>
