<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần mềm Đảo Đề Thi - Trắc Nghiệm</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --bg-color: #f4f7f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 5px;
        }
        .usage-status {
            text-align: center;
            color: var(--danger-color);
            font-style: italic;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .file-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .options-box {
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 5px;
            background: #fafafa;
            margin-bottom: 20px;
        }
        .options-box label {
            display: flex;
            align-items: center;
            font-weight: normal;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .options-box input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
        }
        .inline-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .inline-group input[type="number"] {
            width: 70px;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .tips {
            background-color: #e9f7ef;
            border-left: 4px solid var(--success-color);
            padding: 10px 15px;
            font-size: 13.5px;
            margin-bottom: 20px;
            border-radius: 0 5px 5px 0;
        }
        .tips ul {
            margin: 5px 0 0 0;
            padding-left: 20px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-primary {
            background-color: var(--success-color);
            margin-bottom: 20px;
        }
        .extend-box {
            border-top: 2px dashed #ccc;
            padding-top: 20px;
        }
        .extend-group {
            display: flex;
            gap: 10px;
        }
        .extend-group input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .btn-secondary {
            background-color: var(--primary-color);
            width: auto;
            padding: 10px 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>PHẦN MỀM ĐẢO ĐỀ THI</h1>
    <div class="usage-status" id="usageLabel">Đang tải dữ liệu...</div>

    <div class="form-group">
        <label>Chọn file đề gốc (.docx)</label>
        <input type="file" id="fileInput" class="file-input" accept=".docx">
    </div>

    <div class="tips">
        <strong>💡 Lưu ý chuẩn bị đề gốc:</strong>
        <ul>
            <li>Gạch chân hoặc đánh dấu <b>*</b> vào đáp án đúng để phần mềm nhận dạng.</li>
            <li>Rà soát kỹ nội dung (VD: Câu 10 cần đảm bảo đủ 5 lời thoại; rà soát Câu 27 tránh lặp lại nguyên văn của đề mẫu).</li>
        </ul>
    </div>

    <div class="options-box">
        <label>
            <input type="checkbox" id="chkParts">
            Đảo các phần / đoạn văn (Mục lựa chọn)
        </label>
        <label>
            <input type="checkbox" id="chkQuestions" checked>
            Đảo thứ tự câu hỏi
        </label>
        <label>
            <input type="checkbox" id="chkOptions" checked>
            Đảo đáp án (A, B, C, D) từng câu
        </label>
        
        <div class="inline-group" style="margin-top: 15px;">
            <label style="margin:0;">Số lượng mã đề (Tối đa 50):</label>
            <input type="number" id="numCopies" min="1" max="50" value="1">
        </div>
    </div>

    <button class="btn btn-primary" id="btnShuffle">TIẾN HÀNH ĐẢO ĐỀ</button>

    <div class="extend-box">
        <label>Gia hạn số lần sử dụng:</label>
        <div class="extend-group">
            <input type="password" id="txtPassword" placeholder="Nhập mật khẩu...">
            <button class="btn btn-secondary" id="btnExtend">Kích hoạt (+10 lần)</button>
        </div>
    </div>
</div>

<script>
    // --- QUẢN LÝ SỐ LẦN DÙNG THỬ (LƯU TRÊN LOCALSTORAGE) ---
    const PASSWORD = "sonkiet20032013@";
    let isShuffling = false; // Biến cờ để tránh trừ điểm 2 lần khi bấm nút đảo (do reload)

    function getUsageLeft() {
        let usage = localStorage.getItem('usage_left');
        if (usage === null || isNaN(usage)) {
            usage = 10;
            localStorage.setItem('usage_left', usage);
        }
        return parseInt(usage);
    }

    function setUsageLeft(val) {
        localStorage.setItem('usage_left', val);
        updateUsageUI();
    }

    function updateUsageUI() {
        let usage = getUsageLeft();
        document.getElementById('usageLabel').innerText = `Số lần dùng thử còn lại: ${usage} lần`;
    }

    function decrementUsage() {
        let usage = getUsageLeft();
        if (usage > 0) {
            setUsageLeft(usage - 1);
        }
    }

    // Khởi tạo UI ban đầu
    updateUsageUI();

    // --- XỬ LÝ SỰ KIỆN NÚT BẤM ---

    // 1. Gia hạn mật khẩu
    document.getElementById('btnExtend').addEventListener('click', function() {
        const pwd = document.getElementById('txtPassword').value;
        if (pwd === PASSWORD) {
            let current = getUsageLeft();
            setUsageLeft(current + 10);
            alert("Kích hoạt thành công! Bạn được cộng thêm 10 lần sử dụng.");
            document.getElementById('txtPassword').value = '';
        } else {
            alert("Mật khẩu không chính xác!");
        }
    });

    // 2. Nút tiến hành đảo đề
    document.getElementById('btnShuffle').addEventListener('click', function() {
        let usage = getUsageLeft();
        if (usage <= 0) {
            alert("Bạn đã hết số lần dùng thử. Vui lòng nhập mật khẩu để gia hạn!");
            return;
        }

        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) {
            alert("Vui lòng chọn file Word (VD: MA DE 1101.docx) trước khi đảo!");
            return;
        }

        const numCopies = parseInt(document.getElementById('numCopies').value);
        if (numCopies < 1 || numCopies > 50) {
            alert("Số lượng mã đề phải từ 1 đến 50!");
            return;
        }

        // Đánh dấu đang thực hiện lệnh đảo để sự kiện beforeunload không trừ thêm lượt
        isShuffling = true;
        
        // Trừ 1 lần sử dụng
        decrementUsage();

        // Xử lý giả lập tiến trình đảo đề trên client
        const fileName = fileInput.files[0].name;
        alert(`Đang xử lý ${numCopies} mã đề từ file "${fileName}"...\n\n(Hệ thống giữ nguyên định dạng in đậm và nhận diện đáp án có gạch chân/dấu *).\n\nĐã xuất thành công bảng đáp án và các mã đề!`);
        
        // Reset trạng thái
        setTimeout(() => { isShuffling = false; }, 1000);
    });

    // --- XỬ LÝ SỰ KIỆN THOÁT HOẶC F5 ---
    
    // Bắt sự kiện phím F5
    document.addEventListener('keydown', function(e) {
        if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
            if (getUsageLeft() > 0 && !isShuffling) {
                decrementUsage();
            }
        }
    });

    // Bắt sự kiện đóng tab/trình duyệt
    window.addEventListener('beforeunload', function (e) {
        if (getUsageLeft() > 0 && !isShuffling) {
            decrementUsage();
        }
    });

</script>

</body>
</html>
