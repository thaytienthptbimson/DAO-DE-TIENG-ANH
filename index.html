<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Đảo Đề Tiếng Anh THPT 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .page-break { page-break-after: always; }
            body { background: white; font-size: 12pt; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="bg-blue-700 text-white p-6 rounded-xl shadow-lg no-print">
            <h1 class="text-2xl font-bold">PHẦN MỀM ĐẢO ĐỀ TIẾNG ANH THPT 2026</h1>
            <p class="text-blue-100 text-sm mt-1">Hỗ trợ đảo câu hỏi, phương án & tạo ma trận đáp án tự động</p>
        </header>

        <!-- Form nhập liệu -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 no-print">
            <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <label class="block font-semibold mb-2 text-slate-700">Dán đề thi gốc vào đây:</label>
                <p class="text-xs text-slate-500 mb-2">Định dạng chuẩn: Mỗi câu bắt đầu bằng "Question X:" hoặc "Câu X:", đáp án ký hiệu A., B., C., D. Đánh dấu đáp án đúng bằng dấu * (Ví dụ: *A. Apple).</p>
                <textarea id="rawInput" rows="14" class="w-full p-3 border border-slate-300 rounded-lg font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Question 1: Mark the letter A, B, C, or D...&#10;*A. cat&#10;B. dog&#10;C. bird&#10;D. fish"></textarea>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                <h2 class="font-semibold text-lg text-slate-700 border-b pb-2">Cấu hình đảo đề</h2>
                
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Mã đề bắt đầu:</label>
                    <input type="number" id="startCode" value="101" class="w-full p-2 border border-slate-300 rounded-lg">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Số lượng mã đề cần tạo:</label>
                    <input type="number" id="totalCodes" value="4" min="1" max="10" class="w-full p-2 border border-slate-300 rounded-lg">
                </div>

                <div class="space-y-2 pt-2">
                    <label class="flex items-center space-x-2 text-sm text-slate-700">
                        <input type="checkbox" id="shuffleQuestions" checked class="rounded text-blue-600">
                        <span>Đảo thứ tự câu hỏi</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm text-slate-700">
                        <input type="checkbox" id="shuffleOptions" checked class="rounded text-blue-600">
                        <span>Đảo phương án (A, B, C, D)</span>
                    </label>
                </div>

                <button onclick="processShuffle()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg shadow transition">
                    Tạo Mã Đề & Bảng Đáp Án
                </button>
            </div>
        </div>

        <!-- Kết quả -->
        <div id="outputContainer" class="space-y-8"></div>
    </div>

    <script>
        function parseExam(text) {
            const lines = text.split('\n');
            const questions = [];
            let currentQ = null;

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                // Match câu hỏi (VD: Question 1:, Câu 1:)
                if (/^(Question|Câu)\s+\d+[:.]/i.test(trimmed)) {
                    if (currentQ) questions.push(currentQ);
                    currentQ = {
                        title: trimmed.replace(/^(Question|Câu)\s+\d+[:.]/i, '').trim(),
                        options: [],
                        correctIndex: -1
                    };
                } else if (currentQ && /^(\*?[A-D]\.)/.test(trimmed)) {
                    // Match phương án A., B., C., D.
                    let isCorrect = trimmed.startsWith('*');
                    let optText = trimmed.replace(/^\*?[A-D]\.\s*/, '').trim();
                    if (isCorrect) currentQ.correctIndex = currentQ.options.length;
                    currentQ.options.push(optText);
                } else if (currentQ) {
                    currentQ.title += ' ' + trimmed;
                }
            });
            if (currentQ) questions.push(currentQ);
            return questions;
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function processShuffle() {
            const rawText = document.getElementById('rawInput').value;
            const startCode = parseInt(document.getElementById('startCode').value) || 101;
            const totalCodes = parseInt(document.getElementById('totalCodes').value) || 4;
            const doShuffleQ = document.getElementById('shuffleQuestions').checked;
            const doShuffleOpt = document.getElementById('shuffleOptions').checked;

            const baseQuestions = parseExam(rawText);
            if (baseQuestions.length === 0) {
                alert("Không tìm thấy câu hỏi hợp lệ. Vui lòng kiểm tra lại định dạng input!");
                return;
            }

            const outputContainer = document.getElementById('outputContainer');
            outputContainer.innerHTML = '';

            const answerMatrix = {}; // Store answers for key table
            const optionLabels = ['A', 'B', 'C', 'D'];

            for (let c = 0; c < totalCodes; c++) {
                const code = startCode + c;
                answerMatrix[code] = [];

                let qList = doShuffleQ ? shuffleArray(baseQuestions) : [...baseQuestions];

                let examHtml = `
                    <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 page-break">
                        <div class="flex justify-between items-center border-b pb-4 mb-6">
                            <div>
                                <h3 class="font-bold text-lg">KỲ THI TỐT NGHIỆP THPT NĂM 2026</h3>
                                <p class="text-sm">Môn thi: TIẾNG ANH</p>
                            </div>
                            <div class="text-right">
                                <span class="inline-block bg-slate-900 text-white font-mono px-4 py-1 rounded text-lg font-bold">MÃ ĐỀ: ${code}</span>
                            </div>
                        </div>
                        <div class="space-y-4">
                `;

                qList.forEach((q, idx) => {
                    let indices = q.options.map((_, i) => i);
                    if (doShuffleOpt) indices = shuffleArray(indices);

                    let correctOptLabel = 'N/A';
                    let optionsHtml = '<div class="grid grid-cols-2 gap-2 mt-2">';

                    indices.forEach((origIdx, newIdx) => {
                        const label = optionLabels[newIdx];
                        if (origIdx === q.correctIndex) {
                            correctOptLabel = label;
                        }
                        optionsHtml += `<p><strong>${label}.</strong>${q.options[origIdx]}</p>`;
                    });
                    optionsHtml += '</div>';

                    answerMatrix[code].push({ qNum: idx + 1, ans: correctOptLabel });

                    examHtml += `
                        <div class="text-sm">
                            <p class="font-semibold">Câu ${idx + 1}: ${q.title}</p>${optionsHtml}
                        </div>
                    `;
                });

                examHtml += `</div>
                    <div class="mt-6 no-print flex gap-2">
                        <button onclick="window.print()" class="bg-slate-800 text-white px-4 py-2 rounded text-sm hover:bg-slate-700">In mã đề ${code}</button>
                    </div>
                </div>`;

                outputContainer.innerHTML += examHtml;
            }

            // Bảng Ma Trận Đáp Án
            let matrixHtml = `
                <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 page-break">
                    <h3 class="font-bold text-xl mb-4 text-blue-700">MA TRẬN ĐÁP ÁN TỔNG HỢP</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full border-collapse border border-slate-300 text-sm text-center">
                            <thead>
                                <tr class="bg-slate-100">
                                    <th class="border border-slate-300 p-2">Câu</th>
                                    ${Object.keys(answerMatrix).map(code => `<th class="border border-slate-300 p-2">Mã ${code}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody>
            `;

            const totalQ = baseQuestions.length;
            for (let qIdx = 0; qIdx < totalQ; qIdx++) {
                matrixHtml += `<tr><td class="border border-slate-300 p-2 font-bold">${qIdx + 1}</td>`;
                Object.keys(answerMatrix).forEach(code => {
                    matrixHtml += `<td class="border border-slate-300 p-2">${answerMatrix[code][qIdx].ans}</td>`;
                });
                matrixHtml += `</tr>`;
            }

            matrixHtml += `</tbody></table></div>
                <button onclick="window.print()" class="mt-4 no-print bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700">In Bảng Đáp Án</button>
            </div>`;

            outputContainer.innerHTML = matrixHtml + outputContainer.innerHTML;
        }
    </script>
</body>
</html>
