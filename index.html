<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Đảo Đề Trắc Nghiệm Tiếng Anh</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 24px;
            text-align: center;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        textarea {
            width: 100%;
            height: 500px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            resize: vertical;
            font-size: 14px;
            line-height: 1.5;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-print {
            background-color: #10b981;
            margin-top: 10px;
        }

        .btn-print:hover {
            background-color: #059669;
        }

        /* Tabs styling */
        .tabs-header {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 8px 16px;
            background-color: #e2e8f0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            min-height: 400px;
            font-family: "Times New Roman", Times, serif;
            font-size: 16px;
        }

        .tab-content.active {
            display: block;
        }

        .question-block {
            margin-bottom: 12px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 6px;
            margin-bottom: 12px;
        }

        .options-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
        .options-grid.cols-1 { grid-template-columns: 1fr; }

        .section-intro {
            font-weight: bold;
            margin-top: 24px;
            margin-bottom: 12px;
        }

        /* Matrix Table */
        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
        }

        .matrix-table th, .matrix-table td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: center;
        }

        .matrix-table th {
            background-color: #f8fafc;
        }

        /* Print styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .tab-content {
                box-shadow: none;
                padding: 0;
            }
            .tab-content.active {
                display: block;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header no-print">
            <h1>Phần Mềm Đảo Đề Thi Trắc Nghiệm Tiếng Anh</h1>
            <p style="color: var(--text-muted)">Cấu trúc giữ nguyên thứ tự câu hỏi trong đoạn văn/bài đọc</p>
        </div>

        <div class="main-layout no-print">
            <!-- Cột Trái: Nhập liệu -->
            <div class="card">
                <div class="card-title">1. Dán nội dung đề thi gốc</div>
                <textarea id="rawInput" placeholder="Dán văn bản đề thi thô vào đây...
Ví dụ:
Mark the letter A, B, C or D...
Question 1. Nội dung câu hỏi
A. Đáp án 1   B. Đáp án 2   C. Đáp án 3   D. Đáp án 4"></textarea>
            </div>

            <!-- Cột Phải: Cấu hình -->
            <div class="card">
                <div class="card-title">2. Cấu hình đảo đề</div>
                <div class="form-group">
                    <label for="numCodes">Số lượng mã đề cần tạo:</label>
                    <input type="number" id="numCodes" value="4" min="1" max="24">
                </div>
                <div class="form-group">
                    <label for="startCode">Bắt đầu từ mã đề số:</label>
                    <input type="number" id="startCode" value="101" min="1">
                </div>
                <button class="btn" id="btnShuffle" onclick="processAndShuffle()">Tiến hành đảo đề</button>
                <button class="btn btn-print" onclick="window.print()">🖨️ In nội dung Tab hiện tại</button>
            </div>
        </div>

        <!-- Khu vực hiển thị kết quả -->
        <div id="resultsArea" style="display: none;">
            <div class="tabs-header no-print" id="tabsHeader">
                <!-- Các nút tab sẽ được sinh ra ở đây -->
            </div>
            <div id="tabsContainer">
                <!-- Nội dung các tab (Đề thi & Ma trận) sẽ được sinh ra ở đây -->
            </div>
        </div>
    </div>

<script>
    /* =========================================================
       1. CẤU TRÚC DỮ LIỆU (DATA STRUCTURES)
       ========================================================= */
    class Exam {
        constructor() {
            this.sections = [];
        }
    }

    class Section {
        constructor(intro) {
            this.intro = intro; // Bao gồm câu lệnh (Mark the letter...) và đoạn văn (Passage)
            this.questions = [];
        }
    }

    class Question {
        constructor(originalNum, stem, options) {
            this.originalNum = originalNum;
            this.stem = stem;
            this.options = options; // Mảng 4 chuỗi text tương ứng A, B, C, D gốc
        }
    }

    // Biến lưu trữ dữ liệu đề gốc
    let masterExamData = new Exam();

    /* =========================================================
       2. THUẬT TOÁN BÓC TÁCH (PARSER) - PROMPT 2
       ========================================================= */
    function parseRawText(rawText) {
        let lines = rawText.split('\n');
        let exam = new Exam();
        let currentSection = null;
        let currentQuestion = null;
        let parseMode = 'intro'; // 'intro', 'stem', 'options'

        // Regex phát hiện bắt đầu một phần mới (Section)
        const sectionRegex = /^(Mark the|Read the|Read following|Choose the|Indicate the)/i;
        // Regex phát hiện bắt đầu câu hỏi mới
        const questionRegex = /^Question\s+(\d+)\.(.*)/i;
        // Regex phát hiện bắt đầu của dòng chứa đáp án A.
        const optionStartRegex = /^[A-D]\.\s/i;

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;

            // Kiểm tra xem có phải bắt đầu Section mới không
            if (sectionRegex.test(line)) {
                if (currentSection) exam.sections.push(currentSection);
                currentSection = new Section(line + '\n');
                parseMode = 'intro';
                continue;
            }

            // Kiểm tra xem có phải bắt đầu Câu hỏi mới không
            let qMatch = line.match(questionRegex);
            if (qMatch) {
                // Nếu chưa có section nào được tạo ra, tạo một section mặc định
                if (!currentSection) {
                    currentSection = new Section('');
                }
                currentQuestion = new Question(
                    parseInt(qMatch[1]), 
                    qMatch[2] + '\n', 
                    []
                );
                currentQuestion.optionsRaw = ''; // Lưu tạm chuỗi chứa các đáp án
                currentSection.questions.push(currentQuestion);
                parseMode = 'stem';
                continue;
            }

            // Kiểm tra dòng bắt đầu bằng A. B. C. D.
            if (optionStartRegex.test(line) && currentQuestion) {
                parseMode = 'options';
            }

            // Phân bổ nội dung vào các thuộc tính dựa trên parseMode
            if (parseMode === 'intro' && currentSection) {
                currentSection.intro += line + '\n';
            } else if (parseMode === 'stem' && currentQuestion) {
                currentQuestion.stem += line + '\n';
            } else if (parseMode === 'options' && currentQuestion) {
                currentQuestion.optionsRaw += line + ' ';
            }
        }

        if (currentSection) exam.sections.push(currentSection);

        // Xử lý tách chuỗi `optionsRaw` thành mảng 4 đáp án A, B, C, D độc lập
        exam.sections.forEach(sec => {
            sec.questions.forEach(q => {
                let optStr = q.optionsRaw;
                // Regex thông minh để bắt nội dung theo từng đáp án
                let aMatch = optStr.match(/A\.\s*(.*?)(?=B\.\s*|$)/i);
                let bMatch = optStr.match(/B\.\s*(.*?)(?=C\.\s*|$)/i);
                let cMatch = optStr.match(/C\.\s*(.*?)(?=D\.\s*|$)/i);
                let dMatch = optStr.match(/D\.\s*(.*)/i);

                q.options = [
                    aMatch ? aMatch[1].trim() : "",
                    bMatch ? bMatch[1].trim() : "",
                    cMatch ? cMatch[1].trim() : "",
                    dMatch ? dMatch[1].trim() : ""
                ];
            });
        });

        return exam;
    }

    /* =========================================================
       3. THUẬT TOÁN ĐẢO ĐỀ (SHUFFLER) - PROMPT 3
       ========================================================= */
    function shuffleArray(array) {
        let newArr = [...array];
        for (let i = newArr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
        }
        return newArr;
    }

    function processAndShuffle() {
        const rawText = document.getElementById('rawInput').value;
        if (!rawText.trim()) {
            alert("Vui lòng dán nội dung đề thi vào khung bên trái!");
            return;
        }

        // 1. Parsing dữ liệu
        masterExamData = parseRawText(rawText);
        if (masterExamData.sections.length === 0) {
            alert("Không thể nhận diện cấu trúc đề. Vui lòng kiểm tra lại định dạng (Các phần bắt đầu bằng 'Mark the / Read the...', câu hỏi bắt đầu bằng 'Question X.').");
            return;
        }

        const numCodes = parseInt(document.getElementById('numCodes').value);
        const startCode = parseInt(document.getElementById('startCode').value);

        let generatedExams = []; // Mảng chứa các mã đề đã tạo
        
        // 2. Tiến hành nhân bản và Đảo đề
        for (let i = 0; i < numCodes; i++) {
            let examCode = startCode + i;
            
            // Deep clone để không ảnh hưởng dữ liệu gốc
            let cloneSections = JSON.parse(JSON.stringify(masterExamData.sections));
            
            // RÀNG BUỘC 2.2: Chỉ đảo vị trí của các "Phần thi" (Sections) với nhau.
            let shuffledSections = shuffleArray(cloneSections);

            let questionCounter = 1;
            // Ánh xạ (Mapping) để cập nhật số thứ tự trên intro/passage và làm Ma trận
            // Cấu trúc: mappingData[oldQNum] = { newQNum: X, optMap: { 'A': 'C', 'B': 'A', ... } }
            let mappingData = {}; 

            shuffledSections.forEach(sec => {
                // RÀNG BUỘC 2.1: TUYỆT ĐỐI KHÔNG ĐƯỢC đảo vị trí các câu hỏi bên trong các phần.
                // Do đó, ta duyệt mảng sec.questions theo thứ tự tuyến tính hiện tại
                sec.questions.forEach(q => {
                    let oldNum = q.originalNum;
                    let newNum = questionCounter++;

                    // RÀNG BUỘC 1: ĐƯỢC PHÉP đảo lộn vị trí 4 đáp án (A, B, C, D)
                    // Lưu lại nhãn gốc để truy vết ma trận
                    let optionsWithLabels = q.options.map((text, idx) => {
                        return { text: text, oldLabel: String.fromCharCode(65 + idx) }; // 65 là mã ASCII của 'A'
                    });

                    let shuffledOptions = shuffleArray(optionsWithLabels);
                    
                    q.options = shuffledOptions.map(o => o.text);
                    
                    let optMap = {};
                    shuffledOptions.forEach((o, idx) => {
                        let newLabel = String.fromCharCode(65 + idx);
                        optMap[o.oldLabel] = newLabel; // Ví dụ: Đáp án A gốc giờ biến thành nhãn mới nào
                    });

                    mappingData[oldNum] = { newQNum: newNum, optMap: optMap };
                    q.newNum = newNum;
                });
            });

            // Sau khi có mapping, quay lại update số đếm trong đoạn intro/passage
            // RÀNG BUỘC 3: Tự động đánh lại số câu trong các lời dẫn
            shuffledSections.forEach(sec => {
                // Thay thế chuỗi dạng "from 1 to 5" -> "from [newStart] to [newEnd]"
                sec.intro = sec.intro.replace(/(from\s+)(\d+)(\s+to\s+)(\d+)/gi, (match, p1, p2, p3, p4) => {
                    let n1 = mappingData[parseInt(p2)] ? mappingData[parseInt(p2)].newQNum : p2;
                    let n2 = mappingData[parseInt(p4)] ? mappingData[parseInt(p4)].newQNum : p4;
                    return `${p1}${n1}${p3}${n2}`;
                });

                // Thay thế chuỗi dạng (6), [7], _______(8) trong bài điền từ
                sec.intro = sec.intro.replace(/(\(|\[\vert{}\{)(\d+)(\)\vert{}\]|\})/g, (match, p1, p2, p3) => {
                    let n = mappingData[parseInt(p2)] ? mappingData[parseInt(p2)].newQNum : p2;
                    return `${p1}${n}${p3}`;
                });
            });

            generatedExams.push({
                code: examCode,
                sections: shuffledSections,
                mapping: mappingData
            });
        }

        // 3. Render giao diện HTML
        renderResults(generatedExams);
    }

    /* =========================================================
       4. HIỂN THỊ KẾT QUẢ VÀ MA TRẬN
       ========================================================= */
    function renderResults(exams) {
        document.getElementById('resultsArea').style.display = 'block';
        const tabsHeader = document.getElementById('tabsHeader');
        const tabsContainer = document.getElementById('tabsContainer');
        
        tabsHeader.innerHTML = '';
        tabsContainer.innerHTML = '';

        // Hàm tiện ích tạo giao diện 4 đáp án thông minh (tùy độ dài text)
        function getOptionsHTML(optionsArr) {
            let maxLen = Math.max(...optionsArr.map(o => o.length));
            let gridClass = 'cols-4'; // Mặc định 4 cột
            if (maxLen > 25 && maxLen <= 60) gridClass = 'cols-2'; // Chia 2 cột nếu dài vừa
            else if (maxLen > 60) gridClass = 'cols-1'; // 1 cột nếu quá dài

            const labels = ['A', 'B', 'C', 'D'];
            let html = `<div class="options-grid ${gridClass}">`;
            optionsArr.forEach((opt, idx) => {
                html += `<div><strong>${labels[idx]}.</strong> ${opt}</div>`;
            });
            html += `</div>`;
            return html;
        }

        // Render từng tab Mã đề
        exams.forEach((examData, index) => {
            let tabBtn = document.createElement('button');
            tabBtn.className = `tab-btn no-print ${index === 0 ? 'active' : ''}`;
            tabBtn.innerText = `Mã đề ${examData.code}`;
            tabBtn.onclick = () => switchTab(`tab_code_${examData.code}`, tabBtn);
            tabsHeader.appendChild(tabBtn);

            let tabContent = document.createElement('div');
            tabContent.id = `tab_code_${examData.code}`;
            tabContent.className = `tab-content ${index === 0 ? 'active' : ''}`;

            let html = `<h2 style="text-align: center; margin-bottom: 20px;">ĐỀ THI TIẾNG ANH - MÃ ĐỀ: ${examData.code}</h2>`;

            examData.sections.forEach(sec => {
                // Hiển thị intro/passage (xử lý xuống dòng)
                let introFormatted = sec.intro.replace(/\n/g, '<br/>');
                html += `<div class="section-intro">${introFormatted}</div>`;

                sec.questions.forEach(q => {
                    html += `<div class="question-block">`;
                    html += `<strong>Question ${q.newNum}.</strong> ${q.stem.replace(/\n/g, '<br/>')}`;
                    html += getOptionsHTML(q.options);
                    html += `</div>`;
                });
            });

            tabContent.innerHTML = html;
            tabsContainer.appendChild(tabContent);
        });

        // Render tab Ma trận đáp án
        let matrixBtn = document.createElement('button');
        matrixBtn.className = `tab-btn no-print`;
        matrixBtn.innerText = `Ma trận đáp án`;
        matrixBtn.onclick = () => switchTab('tab_matrix', matrixBtn);
        tabsHeader.appendChild(matrixBtn);

        let matrixContent = document.createElement('div');
        matrixContent.id = `tab_matrix`;
        matrixContent.className = `tab-content`;
        
        let matrixHtml = `<h2 style="text-align: center; margin-bottom: 20px;">MA TRẬN DỊCH CHUYỂN ĐÁP ÁN</h2>`;
        matrixHtml += `<p style="margin-bottom:15px; color:var(--text-muted);"><em>Hướng dẫn đọc: Cột hiển thị: "Gốc Q5 (A➡C, B➡D...)" nghĩa là Câu 5 gốc đã trở thành câu tương ứng ở dòng đó. Đáp án A gốc bị đảo thành C trong mã này.</em></p>`;
        
        matrixHtml += `<table class="matrix-table"><thead><tr>`;
        matrixHtml += `<th>Mã đề / Câu mới</th>`;
        
        // Tìm số câu lớn nhất
        let totalQuestions = 0;
        exams[0].sections.forEach(sec => totalQuestions += sec.questions.length);

        for (let i = 1; i <= totalQuestions; i++) {
            matrixHtml += `<th>Câu ${i}</th>`;
        }
        matrixHtml += `</tr></thead><tbody>`;

        exams.forEach(examData => {
            matrixHtml += `<tr><td><strong>Mã ${examData.code}</strong></td>`;
            for (let i = 1; i <= totalQuestions; i++) {
                // Truy xuất mapping
                let cellData = "";
                for (let oldQ in examData.mapping) {
                    if (examData.mapping[oldQ].newQNum === i) {
                        let optMap = examData.mapping[oldQ].optMap;
                        cellData = `Gốc Q${oldQ}<br>(A➡${optMap['A']}, B➡${optMap['B']}, C➡${optMap['C']}, D➡${optMap['D']})`;
                        break;
                    }
                }
                matrixHtml += `<td>${cellData}</td>`;
            }
            matrixHtml += `</tr>`;
        });
        
        matrixHtml += `</tbody></table>`;
        matrixContent.innerHTML = matrixHtml;
        tabsContainer.appendChild(matrixContent);
    }

    // Chuyển đổi tab
    function switchTab(tabId, btnElement) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

        document.getElementById(tabId).classList.add('active');
        btnElement.classList.add('active');
    }
</script>

</body>
</html>
