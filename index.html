<script type="text/plain" id="engine-py">
import re
import copy
import random
from docx import Document
from docx.oxml.ns import qn
from docx.text.run import Run as _DocxRun

QUESTION_RE = re.compile(r'Question\s+(\d+)\s*\.', re.IGNORECASE)
# Regex tối ưu bắt chuẩn Tiếng Anh & Tiếng Việt (from X to Y, câu X đến Y...)
PART_RE = re.compile(r'(?:from|câu(?: hỏi)?|questions?)\s*(\d+)\s*(?:to|-|đến)\s*(?:câu(?: hỏi)?|questions?)?\s*(\d+)', re.IGNORECASE)
OPTION_START_RE = re.compile(r'^\s*([ABCD])\.\s')
INLINE_OPTIONS_RE = re.compile(r'(?P<A>A\.\s.*?)(?=\t?\s*B\.\s)\t?\s*(?P<B>B\.\s.*?)(?=\t?\s*C\.\s)\t?\s*(?P<C>C\.\s.*?)(?=\t?\s*D\.\s)\t?\s*(?P<D>D\.\s.*)$', re.DOTALL)
CIRCLED = {"A": "\u24B6", "B": "\u24B7", "C": "\u24B8", "D": "\u24B9"} 

def flatten_runs(paragraph):
    spans = []
    pos = [0]
    def walk(el):
        for child in el:
            tag = child.tag
            if tag == qn('w:r'):
                run = _DocxRun(child, paragraph)
                t = run.text
                if t:
                    spans.append((pos[0], pos[0] + len(t), run))
                    pos[0] += len(t)
            elif tag == qn('w:pPr'): continue
            else: walk(child)
    walk(paragraph._p)
    return spans

def para_text(paragraph): return "".join(r.text for _s, _e, r in flatten_runs(paragraph))

def slice_text_runs(spans, start, end):
    out = []
    for s, e, r in spans:
        if e <= start or s >= end: continue
        seg_start = max(s, start)
        seg_end = min(e, end)
        text = r.text[seg_start - s: seg_end - s]
        if text: out.append((text, r))
    return out

def run_has_underline(run):
    rpr = run._r.find(qn('w:rPr'))
    if rpr is None: return False
    u = rpr.find(qn('w:u'))
    if u is None: return False
    val = u.get(qn('w:val'))
    return val not in (None, 'none', '0', 'false')

def copy_rpr(new_run, source_run, strip_underline=False):
    src_rpr = source_run._r.find(qn('w:rPr'))
    if src_rpr is not None:
        new_rpr = copy.deepcopy(src_rpr)
        if strip_underline:
            for u in list(new_rpr.findall(qn('w:u'))): new_rpr.remove(u)
        old = new_run._r.find(qn('w:rPr'))
        if old is not None: new_run._r.remove(old)
        new_run._r.insert(0, new_rpr)

def copy_ppr(new_paragraph, source_paragraph):
    src_ppr = source_paragraph._p.find(qn('w:pPr'))
    if src_ppr is not None:
        new_ppr = copy.deepcopy(src_ppr)
        old = new_paragraph._p.find(qn('w:pPr'))
        if old is not None: new_paragraph._p.remove(old)
        new_paragraph._p.insert(0, new_ppr)

class ParaSpec:
    __slots__ = ("source_paragraph", "segments")
    def __init__(self, source_paragraph, segments):
        self.source_paragraph = source_paragraph
        self.segments = segments

class Option:
    __slots__ = ("letter_orig", "segments", "is_correct")
    def __init__(self, letter_orig, segments, is_correct):
        self.letter_orig = letter_orig
        self.segments = segments
        self.is_correct = is_correct

class QuestionBlock:
    __slots__ = ("number", "stem_paragraphs", "options", "options_mode", "options_ppr_source")
    def __init__(self, number):
        self.number = number
        self.stem_paragraphs = []
        self.options = []
        self.options_mode = None
        self.options_ppr_source = None

def _seg_slice(spans, a, b, number_span=None):
    segments = []
    if number_span and a <= number_span[0] and number_span[1] <= b:
        ns, ne = number_span
        if a < ns:
            for t, r in slice_text_runs(spans, a, ns): segments.append((t, r, False, False))
        for t, r in slice_text_runs(spans, ns, ne): segments.append((t, r, False, True))
        if ne < b:
            for t, r in slice_text_runs(spans, ne, b): segments.append((t, r, False, False))
    else:
        for t, r in slice_text_runs(spans, a, b): segments.append((t, r, False, False))
    return segments

def _make_para_spec(paragraph, a=0, b=None, number_span=None):
    text = para_text(paragraph)
    if b is None: b = len(text)
    spans = flatten_runs(paragraph)
    segments = _seg_slice(spans, a, b, number_span)
    return ParaSpec(paragraph, segments)

def _mark_option_correctness(segments):
    if not segments: return segments, False
    first_text, first_run, _su, _isn = segments[0]
    is_correct = run_has_underline(first_run)
    if is_correct:
        segments = list(segments)
        t, r, _su, isn = segments[0]
        segments[0] = (t, r, True, isn)
    return segments, is_correct

def _extract_inline_options(paragraph, options_text_start):
    text = para_text(paragraph)
    spans = flatten_runs(paragraph)
    sub = text[options_text_start:]
    m = INLINE_OPTIONS_RE.search(sub)
    if not m: return None, None
    options = []
    for letter in "ABCD":
        abs_start = options_text_start + m.start(letter)
        abs_end = options_text_start + m.end(letter)
        segs = _seg_slice(spans, abs_start, abs_end)
        segs, is_correct = _mark_option_correctness(segs)
        options.append(Option(letter, segs, is_correct))
    stem_end_abs = options_text_start + m.start('A')
    return options, stem_end_abs

def _extract_separate_options(paragraphs4):
    options = []
    for letter, p in zip("ABCD", paragraphs4):
        text = para_text(p)
        spans = flatten_runs(p)
        segs = _seg_slice(spans, 0, len(text))
        segs, is_correct = _mark_option_correctness(segs)
        options.append(Option(letter, segs, is_correct))
    return options

def parse_exam(docx_path):
    doc = Document(docx_path)
    paragraphs = doc.paragraphs
    n = len(paragraphs)
    marker_at, marker_span_at = {}, {}
    for i, p in enumerate(paragraphs):
        m = QUESTION_RE.search(para_text(p))
        if m:
            marker_at[i] = int(m.group(1))
            marker_span_at[i] = m.span(1)

    marker_indices = sorted(marker_at.keys())
    prelude, questions, fillers_after = [], [], {}
    first_marker_idx = marker_indices[0] if marker_indices else n
    for i in range(0, first_marker_idx):
        prelude.append(_make_para_spec(paragraphs[i]))

    for mi_pos, idx in enumerate(marker_indices):
        qnum = marker_at[idx]
        num_span = marker_span_at[idx]
        qb = QuestionBlock(qnum)
        marker_para = paragraphs[idx]
        marker_para_text = para_text(marker_para)
        after_marker = QUESTION_RE.search(marker_para_text).end()
        next_marker_idx = marker_indices[mi_pos + 1] if mi_pos + 1 < len(marker_indices) else n

        opts, stem_end_abs = _extract_inline_options(marker_para, after_marker)
        cursor = idx + 1
        if opts is not None:
            qb.stem_paragraphs.append(_make_para_spec(marker_para, 0, stem_end_abs, num_span))
            qb.options = opts
            qb.options_mode = 'inline_with_marker'
            qb.options_ppr_source = marker_para
        else:
            qb.stem_paragraphs.append(_make_para_spec(marker_para, 0, len(marker_para_text), num_span))
            found_options = False
            while cursor < next_marker_idx:
                p = paragraphs[cursor]
                text = para_text(p)
                if OPTION_START_RE.match(text):
                    m_inline = INLINE_OPTIONS_RE.search(text)
                    if m_inline and m_inline.start('A') == 0:
                        opts, _ = _extract_inline_options(p, 0)
                        qb.options = opts
                        qb.options_mode = 'same_line'
                        qb.options_ppr_source = p
                        cursor += 1
                        found_options = True
                        break
                    m0 = OPTION_START_RE.match(text)
                    if m0.group(1) == 'A' and cursor + 3 < next_marker_idx:
                        p2, p3, p4 = paragraphs[cursor + 1], paragraphs[cursor + 2], paragraphs[cursor + 3]
                        m1, m2, m3 = (OPTION_START_RE.match(para_text(p2)), OPTION_START_RE.match(para_text(p3)), OPTION_START_RE.match(para_text(p4)))
                        if m1 and m1.group(1) == 'B' and m2 and m2.group(1) == 'C' and m3 and m3.group(1) == 'D':
                            opts = _extract_separate_options([p, p2, p3, p4])
                            qb.options = opts
                            qb.options_mode = 'separate'
                            qb.options_ppr_source = p
                            cursor += 4
                            found_options = True
                            break
                qb.stem_paragraphs.append(_make_para_spec(p))
                cursor += 1
            if not found_options:
                qb.options = []
                qb.options_mode = None

        questions.append(qb)
        fillers_after[qnum] = []
        for i in range(cursor, next_marker_idx):
            fillers_after[qnum].append(_make_para_spec(paragraphs[i]))

    return {"doc_path": docx_path, "prelude": prelude, "questions": questions, "fillers_after": fillers_after}

def detect_parts(parsed):
    parts = []
    texts = []
    def spec_text(spec): return "".join(seg[0] for seg in spec.segments)
    for spec in parsed["prelude"]: texts.append(spec_text(spec))
    for qnum, specs in parsed["fillers_after"].items():
        for spec in specs: texts.append(spec_text(spec))

    for text in texts:
        m = PART_RE.search(text)
        if m:
            qf, qt = int(m.group(1)), int(m.group(2))
            # KIỂM TRA DẤU < > ĐỂ TỰ ĐỘNG KHÓA
            has_explicit_lock = '<' in text and '>' in text
            label = text.replace('<', '').replace('>', '').strip()
            if len(label) > 100: label = label[:97] + "..."
            parts.append({"label": label, "q_from": qf, "q_to": qt, "is_cloze": has_explicit_lock, "explicit_lock": has_explicit_lock})

    qmap = {q.number: q for q in parsed["questions"]}
    for part in parts:
        # Nếu chưa khóa bằng < >, kiểm tra xem có phải dạng điền khuyết không
        if not part.get("explicit_lock"):
            empties, total = 0, 0
            for qn in range(part["q_from"], part["q_to"] + 1):
                q = qmap.get(qn)
                if q is None: continue
                total += 1
                raw = "".join(seg[0] for sp in q.stem_paragraphs for seg in sp.segments)
                stripped = QUESTION_RE.sub('', raw, count=1).strip()
                if stripped == "": empties += 1
            if total and empties / total >= 0.5: part["is_cloze"] = True

    parts.sort(key=lambda x: x["q_from"])
    return parts

def shuffle_plan(parsed, parts, opts, rng=None):
    if rng is None: rng = random
    qmap = {q.number: q for q in parsed["questions"]}
    all_numbers = sorted(qmap.keys())
    
    q_to_part = {}
    for pi, part in enumerate(parts):
        for qn in range(part["q_from"], part["q_to"] + 1):
            q_to_part[qn] = pi
            
    blocks = []
    current_block = None
    for qn in all_numbers:
        p = q_to_part.get(qn)
        if current_block is None or current_block["part_idx"] != p:
            if current_block is not None: blocks.append(current_block)
            current_block = {"part_idx": p, "qnums": [], "specs_before": [], "specs_internal": {}}
        current_block["qnums"].append(qn)
    if current_block is not None: blocks.append(current_block)
        
    split_idx = len(parsed["prelude"])
    if blocks and blocks[0]["part_idx"] is not None:
        part_info = parts[blocks[0]["part_idx"]]
        target_str = str(part_info["q_from"])
        for i, spec in enumerate(parsed["prelude"]):
            text = "".join(seg[0] for seg in spec.segments)
            m = PART_RE.search(text)
            if m and m.group(1) == target_str:
                split_idx = i
                break
                
    global_header = parsed["prelude"][:split_idx]
    if blocks: blocks[0]["specs_before"].extend(parsed["prelude"][split_idx:])
        
    for i, block in enumerate(blocks):
        for j, qn in enumerate(block["qnums"]):
            if j == len(block["qnums"]) - 1: 
                if i + 1 < len(blocks): blocks[i + 1]["specs_before"].extend(parsed["fillers_after"].get(qn, []))
                else: block["specs_internal"][qn] = parsed["fillers_after"].get(qn, [])
            else: block["specs_internal"][qn] = parsed["fillers_after"].get(qn, [])
                
    # 1. Đảo vị trí các KHỐI
    shuffle_parts_globally = opts.get("shuffle_parts", False)
    if shuffle_parts_globally:
        rng.shuffle(blocks)
        
    # 2. Xáo đáp án và câu hỏi bên trong khối
    option_perm = {}
    for qn, q in qmap.items(): option_perm[qn] = list(q.options)
        
    for block in blocks:
        p_idx = block["part_idx"]
        if p_idx is not None:
            cfg = opts.get(p_idx, {})
            part_info = parts[p_idx]
            
            if cfg.get("shuffle_options"):
                for qn in block["qnums"]:
                    if qn in qmap and len(qmap[qn].options) == 4:
                        order = [0, 1, 2, 3]
                        rng.shuffle(order)
                        option_perm[qn] = [qmap[qn].options[i] for i in order]
                        
            # CẤM xáo trộn nếu bị khóa (is_cloze = True do < > hoặc tự động)
            if cfg.get("shuffle_order") and not part_info["is_cloze"] and len(block["qnums"]) > 1:
                rng.shuffle(block["qnums"])
                
    new_order = []
    for block in blocks: new_order.extend(block["qnums"])
        
    number_str_map = {old_qn: str(pos + 1) for pos, old_qn in enumerate(new_order)}
    return global_header, blocks, option_perm, number_str_map, new_order

def _copy_seg_run(paragraph, seg, new_number_str=None):
    text, run, strip_u, is_number = seg
    out_text = new_number_str if (is_number and new_number_str is not None) else text
    r = paragraph.add_run(out_text)
    copy_rpr(r, run, strip_underline=strip_u)
    return r

def _emit_plain_paragraph(doc, spec):
    p = doc.add_paragraph()
    copy_ppr(p, spec.source_paragraph)
    for seg in spec.segments: _copy_seg_run(p, seg)
    return p

_LEADING_LETTER_RE = re.compile(r'^(\s*)([ABCD])(\.)')

def _relabel_first_char(seg, new_letter):
    text, run, strip_u, is_number = seg
    m = _LEADING_LETTER_RE.match(text)
    if m: text = text[:m.start(2)] + new_letter + text[m.end(2):]
    return (text, run, strip_u, is_number)

def _emit_option_run(paragraph, opt, new_letter, is_first_of_opt):
    for j, seg in enumerate(opt.segments):
        if j == 0 and is_first_of_opt: seg = _relabel_first_char(seg, new_letter)
        _copy_seg_run(paragraph, seg)

def render_exam_docx(parsed, global_header, blocks, option_perm, number_str_map, out_path, header_line=None):
    doc = Document(parsed["doc_path"])
    body = doc.element.body
    sect_prs = body.findall(qn('w:sectPr'))
    for child in list(body):
        if child.tag != qn('w:sectPr'): body.remove(child)
        
    if header_line:
        p = doc.add_paragraph()
        r = p.add_run(header_line)
        r.bold = True
        
    qmap = {q.number: q for q in parsed["questions"]}
    for spec in global_header: _emit_plain_paragraph(doc, spec)
        
    for block in blocks:
        for spec in block["specs_before"]: _emit_plain_paragraph(doc, spec)
        for old_qn in block["qnums"]:
            q = qmap[old_qn]
            new_num_str = number_str_map[old_qn]
            opts = option_perm[old_qn]
            
            if q.options_mode == 'inline_with_marker':
                p = doc.add_paragraph()
                copy_ppr(p, q.stem_paragraphs[0].source_paragraph)
                for seg in q.stem_paragraphs[0].segments: _copy_seg_run(p, seg, new_num_str)
                for i, opt in enumerate(opts):
                    if i > 0:
                        tab_run = p.add_run("\t")
                        copy_rpr(tab_run, opt.segments[0][1])
                    _emit_option_run(p, opt, "ABCD"[i], True)
            else:
                for sp in q.stem_paragraphs:
                    p = doc.add_paragraph()
                    copy_ppr(p, sp.source_paragraph)
                    for seg in sp.segments: _copy_seg_run(p, seg, new_num_str)
                if q.options_mode == 'same_line':
                    p = doc.add_paragraph()
                    copy_ppr(p, q.options_ppr_source)
                    for i, opt in enumerate(opts):
                        if i > 0:
                            tab_run = p.add_run("\t")
                            copy_rpr(tab_run, opt.segments[0][1])
                        _emit_option_run(p, opt, "ABCD"[i], True)
                elif q.options_mode == 'separate':
                    for i, opt in enumerate(opts):
                        p = doc.add_paragraph()
                        copy_ppr(p, q.options_ppr_source)
                        _emit_option_run(p, opt, "ABCD"[i], True)

            for spec in block["specs_internal"].get(old_qn, []): _emit_plain_paragraph(doc, spec)
                
    if sect_prs: body.append(copy.deepcopy(sect_prs[-1]))
    doc.save(out_path)

def compute_answer_key(new_order, option_perm, number_str_map):
    result = []
    for old_qn in new_order:
        opts = option_perm[old_qn]
        correct_letter = None
        for i, opt in enumerate(opts):
            if opt.is_correct: correct_letter = "ABCD"[i]; break
        result.append((number_str_map[old_qn], correct_letter))
    return result

def build_answer_key_docx(all_keys, out_path):
    doc = Document()
    doc.add_heading("BẢNG ĐÁP ÁN", level=1)
    for ma_de_label, keys in all_keys:
        doc.add_heading(ma_de_label, level=2)
        table = doc.add_table(rows=0, cols=10)
        table.style = "Table Grid"
        for i in range(0, len(keys), 10):
            row_cells = table.add_row().cells
            for j, (num_str, letter) in enumerate(keys[i:i + 10]):
                shown = CIRCLED.get(letter, "?") if letter else "?"
                row_cells[j].text = f"{num_str}. {shown}"
    doc.save(out_path)
</script>

<script type="text/plain" id="wrapper-py">
import io, sys, json, base64, random, types
engine_code = open('/engine_source.py').read()
engine_module = types.ModuleType('engine')
exec(engine_code, engine_module.__dict__)
sys.modules['engine'] = engine_module
import engine

G_PARSED = None
G_PARTS = None

def parse_docx(base64_data):
    global G_PARSED, G_PARTS
    file_bytes = base64.b64decode(base64_data)
    with open('/input.docx', 'wb') as f: f.write(file_bytes)
    G_PARSED = engine.parse_exam('/input.docx')
    G_PARTS = engine.detect_parts(G_PARSED)
    return json.dumps(G_PARTS)

def generate_shuffled(options_json):
    opts = json.loads(options_json)
    num_ma_de = opts.pop('num_ma_de', 4)
    start_code = opts.pop('start_code', 101)
    insert_header = opts.pop('insert_header', True)
    shuffle_parts_globally = opts.pop('shuffle_parts', False)
    
    py_opts = {"shuffle_parts": shuffle_parts_globally}
    for k, v in opts.items():
        if k.isdigit(): py_opts[int(k)] = v
            
    out_files = {}
    all_keys = []
    
    for i in range(num_ma_de):
        ma_de = str(start_code + i)
        global_header, blocks, option_perm, number_str_map, new_order = engine.shuffle_plan(G_PARSED, G_PARTS, py_opts, rng=random)
        header_line = f"Mã đề: {ma_de}" if insert_header else None
        out_path = f"/MaDe_{ma_de}.docx"
        engine.render_exam_docx(G_PARSED, global_header, blocks, option_perm, number_str_map, out_path, header_line=header_line)
        keys = engine.compute_answer_key(new_order, option_perm, number_str_map)
        all_keys.append((f"Mã đề {ma_de}", keys))
        
        with open(out_path, 'rb') as f:
            out_files[f"MaDe_{ma_de}.docx"] = base64.b64encode(f.read()).decode('utf-8')
            
    key_path = "/BangDapAn.docx"
    engine.build_answer_key_docx(all_keys, key_path)
    with open(key_path, 'rb') as f:
        out_files["BangDapAn.docx"] = base64.b64encode(f.read()).decode('utf-8')
        
    return json.dumps(out_files)
</script>

        btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> ĐANG TẠO MÃ ĐỀ...`;
